# cloudbuild.yaml
substitutions:
  _REGION: asia-northeast1
  _SERVICE: event-support-server
  _REPOSITORY: event-support
  _IMAGE: event-support-server
  _CLOUDSQL_INSTANCE: event-support-app:asia-northeast1:event-support-db
  # 確認メールの送信元アカウント（SMTP_USER）。Gmail の場合はアプリパスワードを
  # Secret Manager の SMTP_PASS に入れる。組織ログイン用のメールとは無関係。
  _SMTP_HOST: smtp.gmail.com
  _SMTP_PORT: "587"
  _SMTP_USER: CHANGE_ME@gmail.com

steps:
  # 1. Docker イメージをビルド
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  # 2. Artifact Registry に push
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}

  # 3. Cloud Run にデプロイ
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --session-affinity
      - --timeout=3600
      # コスト最優先のため常時起動はしない（無アクセス時は 0 にスケールし課金ゼロ）。
      # コールドスタートを避けたいイベント本番当日のみ、コンソール等で一時的に
      # min-instances=1 へ引き上げ、終了後に 0 へ戻す運用とする。
      - --min-instances=0
      # socket.io はインメモリ管理（Redis 等の共有 adapter なし）。複数インスタンス
      # に増えるとチェックインを受けたインスタンスと運営画面の socket が別になり
      # WebSocket 配信が届かなくなるため、1 インスタンスに固定する。
      # 運営画面のみ socket を張り負荷も軽いため 1 台で十分。
      - --max-instances=1
      # Cloud SQL（MySQL 8.0）へ Unix ソケット /cloudsql/<接続名> で繋ぐ。
      # DATABASE_URL の ?socket= が src/db/parse-mysql-url.ts で socketPath に変換される。
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      # update ではなく set。update だと既存サービスに残る SAKURA_PROXY_URL が消えず、
      # index.ts が従来どおりプロキシ経路を選んでしまい切り替えが無言で失敗する。
      # 区切りは @（CORS_ORIGIN がカンマを含むため）。
      # NODE_ENV=production では SMTP_HOST が無いと起動時に落ちる（src/config.ts）。
      # 本番はオーガナイザー登録 API を止める（410）。組織アカウントは DB に直接 INSERT する。
      - --set-env-vars=^@^CORS_ORIGIN=https://event-support-app.web.app,https://event-support-app.firebaseapp.com@FRONTEND_BASE_URL=https://event-support-app.web.app@SMTP_HOST=${_SMTP_HOST}@SMTP_PORT=${_SMTP_PORT}@SMTP_USER=${_SMTP_USER}@MAIL_FROM=PRoToFES <${_SMTP_USER}>@ORGANIZER_SIGNUP_MODE=disabled
      - --set-secrets=JWT_SECRET=JWT_SECRET:latest,WEBHOOK_API_KEY=WEBHOOK_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,ADMIN_REGISTRATION_KEY=ADMIN_REGISTRATION_KEY:latest,SMTP_PASS=SMTP_PASS:latest

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
