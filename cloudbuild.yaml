# cloudbuild.yaml
substitutions:
  _REGION: asia-northeast1
  _SERVICE: event-support-server
  _REPOSITORY: event-support
  _IMAGE: event-support-server
  # 本番 DB はさくら（sutolab_bingo）。サーバーは HTTP プロキシ経由で SQL を投げる（src/db/http-proxy.ts）。
  _SAKURA_PROXY_URL: https://sutolab.sakura.ne.jp/bingo/query/index.php
  # 確認メールの送信元アカウント（SMTP_USER）。Gmail の場合はアプリパスワードを
  # Secret Manager の SMTP_PASS に入れる。組織ログイン用のメールとは無関係。
  _SMTP_HOST: smtp.gmail.com
  _SMTP_PORT: "587"
  _SMTP_USER: protofesapp@gmail.com

steps:
  # 1. Docker イメージをビルド
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  # 2. Artifact Registry に push
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}

  # 3. Cloud Run にデプロイ
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --session-affinity
      - --timeout=3600
      # コスト最優先のため常時起動はしない（無アクセス時は 0 にスケールし課金ゼロ）。
      # コールドスタートを避けたいイベント本番当日のみ、コンソール等で一時的に
      # min-instances=1 へ引き上げ、終了後に 0 へ戻す運用とする。
      - --min-instances=0
      # socket.io はインメモリ管理（Redis 等の共有 adapter なし）。複数インスタンス
      # に増えるとチェックインを受けたインスタンスと運営画面の socket が別になり
      # WebSocket 配信が届かなくなるため、1 インスタンスに固定する。
      # 運営画面のみ socket を張り負荷も軽いため 1 台で十分。
      - --max-instances=1
      # 本番 DB を Cloud SQL からさくらのプロキシ経由に戻した（2026-10-08）。
      # Cloud SQL への接続は不要なので外す。
      - --clear-cloudsql-instances
      # update ではなく set。前回の値を残さず、ここに書いたものだけを正とする。
      # SAKURA_PROXY_URL があると index.ts はプロキシ経路を選ぶ（DATABASE_URL より優先）。
      # キーは Secret Manager の SAKURA_PROXY_KEY（さくら側 index.php の設定値と同じ）。
      # 区切りは |（CORS_ORIGIN がカンマを、SMTP_USER / MAIL_FROM が @ を含むため）。
      # @ を区切りにすると gmail.com が独立した項目になり gcloud が引数エラーで落ちる。
      # NODE_ENV=production では SMTP_HOST が無いと起動時に落ちる（src/config.ts）。
      # 本番はオーガナイザー登録 API を止める（410）。組織アカウントは DB に直接 INSERT する。
      - --set-env-vars=^|^CORS_ORIGIN=https://event-support-app.web.app,https://event-support-app.firebaseapp.com|FRONTEND_BASE_URL=https://event-support-app.web.app|SMTP_HOST=${_SMTP_HOST}|SMTP_PORT=${_SMTP_PORT}|SMTP_USER=${_SMTP_USER}|MAIL_FROM=PRoToFES <${_SMTP_USER}>|ORGANIZER_SIGNUP_MODE=disabled|SAKURA_PROXY_URL=${_SAKURA_PROXY_URL}
      - --set-secrets=JWT_SECRET=JWT_SECRET:latest,WEBHOOK_API_KEY=WEBHOOK_API_KEY:latest,SAKURA_PROXY_KEY=SAKURA_PROXY_KEY:latest,ADMIN_REGISTRATION_KEY=ADMIN_REGISTRATION_KEY:latest,SMTP_PASS=SMTP_PASS:latest

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
